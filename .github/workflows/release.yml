name: Release npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run quality
      - run: npm audit --omit=dev
      - name: Validate tag and package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p \"require('./package.json').version\")"
      - name: Publish with the correct distribution tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance --tag latest
          fi
